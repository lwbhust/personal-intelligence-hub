name: PersonalIntelligenceHub

options:
  minimumXcodeGenVersion: "2.46.0"
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  PersonalIntelligenceHub:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PersonalIntelligenceHub
      - path: Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pih.PersonalIntelligenceHub
        PRODUCT_NAME: PersonalIntelligenceHub
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "0.14.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: "YES"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        ENABLE_APP_SANDBOX: "NO"

  PersonalIntelligenceHubTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PersonalIntelligenceHubTests
    dependencies:
      - target: PersonalIntelligenceHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pih.PersonalIntelligenceHubTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PersonalIntelligenceHub.app/Contents/MacOS/PersonalIntelligenceHub"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PersonalIntelligenceHub:
    build:
      targets:
        PersonalIntelligenceHub: all
        PersonalIntelligenceHubTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PersonalIntelligenceHubTests
    archive:
      config: Release
