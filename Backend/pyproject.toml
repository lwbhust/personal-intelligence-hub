[project]
name = "pih-backend"
version = "0.11.0"
description = "Personal Intelligence Hub local Sidecar (Phase 3)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "feedparser==6.0.11",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
